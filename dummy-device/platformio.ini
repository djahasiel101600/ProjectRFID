; PlatformIO Project Configuration File
; Dummy ESP32 - IoT Attendance & Energy Monitoring Simulator

[env:esp32dev]
platform     = espressif32
board        = esp32dev
framework    = arduino
monitor_speed = 115200

; Only the two external libs needed — WebServer, Preferences,
; WiFi, and DNSServer are all built-in Arduino ESP32 core libs.
lib_deps =
    links2004/WebSockets@^2.4.1
    bblanchon/ArduinoJson@^7.0.0

build_flags =
    -DCORE_DEBUG_LEVEL=1

upload_speed = 921600
